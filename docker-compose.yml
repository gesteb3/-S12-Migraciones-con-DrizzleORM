services:
  postgres:
    image: postgres:16-alpine
    container_name: hardware_inventory_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hardware_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - hardware_inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hardware_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hardware_inventory_data:

